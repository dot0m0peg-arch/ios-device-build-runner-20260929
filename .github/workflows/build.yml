name: Encrypted iPhone build check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 27
    steps:
      - name: Check out encrypted build input
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Open input
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/cipher"
          "$RUNNER_TEMP/cipher/bin/pip" -q install cryptography==50.0.1
          "$RUNNER_TEMP/cipher/bin/python" - <<'PY'
          import io, os, pathlib, zipfile
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          data=pathlib.Path("build-input.aesgcm").read_bytes()
          payload=AESGCM(bytes.fromhex(os.environ["IPA_KEY_HEX"])).decrypt(data[:12],data[12:],None)
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              archive.extractall(pathlib.Path(os.environ["RUNNER_TEMP"])/"candidate")
          PY
      - name: Archive and verify distribution build
        shell: bash
        env:
          APPLE_DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          APPLE_SIGNING_P12_PASSWORD: ${{ secrets.APPLE_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof"
          python3 "$RUNNER_TEMP/candidate/tools/sign-mac.py" "$RUNNER_TEMP/proof" > "$RUNNER_TEMP/proof/sign.log" 2>&1
      - name: Compile and test
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof"
          bash "$RUNNER_TEMP/candidate/tools/verify-mac.sh" "$RUNNER_TEMP/proof" > "$RUNNER_TEMP/proof/steps.log" 2>&1
      - name: Seal output and diagnostics
        if: always()
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cipher/bin/python" - <<'PY'
          import hashlib, io, json, os, pathlib, zipfile
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          temp=pathlib.Path(os.environ["RUNNER_TEMP"]); proof=temp/"proof"
          output=io.BytesIO()
          with zipfile.ZipFile(output,"w",zipfile.ZIP_DEFLATED) as z:
              for pattern in ("*.log","xcode.txt","Loam-unsigned-device.ipa","Loam-1.0-1.ipa","signed.json","native-save.json","probe.json","attachments/*"):
                  for item in proof.glob(pattern):
                      if item.is_file(): z.write(item,item.relative_to(proof))
          nonce=os.urandom(12)
          (temp/"results.aesgcm").write_bytes(nonce+AESGCM(bytes.fromhex(os.environ["IPA_KEY_HEX"])).encrypt(nonce,output.getvalue(),None))
          PY
      - name: Deliver encrypted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-results
          path: ${{ runner.temp }}/results.aesgcm
          if-no-files-found: error
          retention-days: 1
