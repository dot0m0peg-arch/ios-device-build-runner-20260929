name: Sophia clear voice device build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Decrypt current Sophia source
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/cryptoenv"
          "$RUNNER_TEMP/cryptoenv/bin/pip" install --quiet cryptography==50.0.1
          "$RUNNER_TEMP/cryptoenv/bin/python" - <<'PY'
          import os, io, zipfile
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          raw = Path('sophia/source.zip.aesgcm').read_bytes()
          plain = AESGCM(bytes.fromhex(os.environ['IPA_KEY_HEX'])).decrypt(raw[:12], raw[12:], None)
          target = Path(os.environ['RUNNER_TEMP']) / 'sophia-source'
          with zipfile.ZipFile(io.BytesIO(plain)) as z:
              for name in z.namelist():
                  if not (target / name).resolve().is_relative_to(target.resolve()):
                      raise ValueError('Source path outside package')
              z.extractall(target)
          PY
      - name: Test Swift package and actual iOS voice target then build current iPad app
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sophia-source"
          swift test > "$RUNNER_TEMP/sophia-build.log" 2>&1
          SIM=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for a in d["devices"].values() for v in a if "iPad" in v["name"]))')
          xcodebuild -project SophiasSightWords.xcodeproj -scheme SophiasSightWords -configuration Debug -destination "platform=iOS Simulator,id=$SIM" -parallel-testing-enabled NO -derivedDataPath "$RUNNER_TEMP/sim-derived" CODE_SIGNING_ALLOWED=NO test >> "$RUNNER_TEMP/sophia-build.log" 2>&1
          xcodebuild -project SophiasSightWords.xcodeproj -scheme SophiasSightWords -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO build >> "$RUNNER_TEMP/sophia-build.log" 2>&1
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/derived/Build/Products/Debug-iphoneos/SophiasSightWords.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$RUNNER_TEMP/SophiasSightWords-clear-voice-unsigned.ipa" Payload
      - name: Encrypt output and diagnostics
        if: always()
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cryptoenv/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root=Path(os.environ['RUNNER_TEMP'])
          cipher=AESGCM(bytes.fromhex(os.environ['IPA_KEY_HEX']))
          for name in ['SophiasSightWords-clear-voice-unsigned.ipa','sophia-build.log']:
              path=root/name
              if path.exists():
                  nonce=os.urandom(12)
                  (root/(name+'.aesgcm')).write_bytes(nonce+cipher.encrypt(nonce,path.read_bytes(),None))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sophia-encrypted-device-build
          path: ${{ runner.temp }}/SophiasSightWords-clear-voice-unsigned.ipa.aesgcm
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sophia-encrypted-build-log
          path: ${{ runner.temp }}/sophia-build.log.aesgcm
          retention-days: 1
          if-no-files-found: ignore
