name: Compare actual WebKit compositing on standard macOS 15
on: workflow_dispatch
permissions:
  contents: read
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {app: Timbersack, scheme: Timbersack-Mac, bundle: com.charbej.timbersack, device: Mac, slot: Timbersack-Mac}
    env:
      APP_KEY: ${{ matrix.app }}
      SCHEME: ${{ matrix.scheme }}
      BUNDLE: ${{ matrix.bundle }}
      DEVICE: ${{ matrix.device }}
      BASE_REF: e3e971e44dd6f468fb7b576ab98c3016ca71b8d3
    steps:
      - name: Prepare Xcode and fetch only required encrypted files
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        run: |
          set -euo pipefail
          exec >> "$RUNNER_TEMP/capture.log" 2>&1
          ls -d /Applications/Xcode*.app
          printf '%s\n' 'Installed Xcode candidates checked above. This job uses Xcode 26.3.'
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer xcodebuild -version
          brew install xcodegen
          python3 -m venv "$RUNNER_TEMP/cryptoenv"
          "$RUNNER_TEMP/cryptoenv/bin/pip" install --quiet cryptography==50.0.1 'pillow>=12.2,<13'
          "$RUNNER_TEMP/cryptoenv/bin/python" - <<'PY'
          import hashlib
          from io import BytesIO
          import json
          import os
          from pathlib import Path
          import subprocess
          from zipfile import ZipFile
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from concurrent.futures import ThreadPoolExecutor

          root = Path(os.environ['RUNNER_TEMP']).resolve() / 'capture-source'
          root.mkdir()
          app = os.environ['APP_KEY']
          remote = 'https://raw.githubusercontent.com/' + os.environ['GITHUB_REPOSITORY']
          cipher = AESGCM(bytes.fromhex(os.environ['IPA_KEY_HEX']))

          def fetch(ref, path):
              return subprocess.run(['curl', '--fail', '--silent', '--show-error',
                  '--retry', '2', '--max-time', '110', f'{remote}/{ref}/{path}'],
                  check=True, capture_output=True, timeout=120).stdout

          def checked_extract(archive):
              for name in archive.namelist():
                  if not (root / name).resolve().is_relative_to(root):
                      raise ValueError('Archive entry escaped its directory.')
              archive.extractall(root)

          encrypted = fetch(os.environ['GITHUB_SHA'], 'apple-port/final-capture-audit/overlay.aesgcm')
          patch = cipher.decrypt(encrypted[:12], encrypted[12:], b'final-capture-acceptance')
          with ZipFile(BytesIO(patch)) as overlay:
              expect = json.loads(overlay.read('audit/payload-index.json'))[app]

              def segment(index):
                  raw = fetch(os.environ['BASE_REF'], f'apple-port/{app}/{index:03d}.aesgcm')
                  return cipher.decrypt(raw[:12], raw[12:], f'{app}:{index}'.encode())

              base = root.parent / 'game-source.zip'
              with base.open('wb') as output, ThreadPoolExecutor(max_workers=3) as pool:
                  for plain in pool.map(segment, range(expect['segments'])):
                      output.write(plain)
              with ZipFile(base) as original:
                  checked_extract(original)
              checked_extract(overlay)

          actual = {}
          game = root / 'Apps' / app / 'game'
          for file in game.rglob('*'):
              if file.is_file():
                  with file.open('rb') as stream:
                      actual[file.relative_to(root).as_posix()] = hashlib.file_digest(stream, 'sha256').hexdigest()
          if expect['files'] != actual:
              raise ValueError('Exactly packaged game files did not match the released payload.')
          print(f'SHA-256 verified {len(actual)} game resources for {app}.')
          PY
      - name: Capture actual gameplay and test native app relaunch
        run: |
          set -euo pipefail
          exec >> "$RUNNER_TEMP/capture.log" 2>&1
          root="$RUNNER_TEMP/capture-source"
          product="$root/build/$SCHEME/products/$APP_KEY.app"
          if [[ "$APP_KEY" == LastCarUpright ]]; then
            python3 - "$root/audit/screenshot-scenes.js" <<'PY'
          from pathlib import Path
          import sys
          source = Path(sys.argv[1])
          text = source.read_text()
          old = """        await click('[data-a=h2h]');
                  await click('[data-a=go]');
                  await click('[data-a=go]');"""
          old = old.replace("\n                  ", "\n        ")
          new = """        await wait('native Head to Head engine', () => window.LCU?.api?.startH2H);
                  window.LCU.api.startH2H('chalk', 'ruckus');"""
          new = new.replace("\n                  ", "\n        ")
          if text.count(old) != 1:
              raise ValueError('Existing screenshot scene source mismatch.')
          source.write_text(text.replace(old, new))
          PY
          fi
          python3 - "$root/audit/RuntimeScreenshots.swift" <<'PY'
          from pathlib import Path
          import sys
          source = Path(sys.argv[1])
          text = source.read_text()
          old = "                window.setContentSize(NSSize(width: CGFloat(desiredWidth) / scale, height: CGFloat(desiredHeight) / scale))\n                window.makeKeyAndOrderFront(nil)\n                try await Task.sleep(for: .milliseconds(900))\n                return window"
          new = "                let target = NSSize(width: CGFloat(desiredWidth) / scale, height: CGFloat(desiredHeight) / scale)\n                window.setContentSize(target)\n                window.makeKeyAndOrderFront(nil)\n                for _ in 0..<6 {\n                    try await Task.sleep(for: .milliseconds(350))\n                    let actual = window.convertToScreen(view.convert(view.bounds, to: nil)).size\n                    let offset = NSSize(width: target.width - actual.width, height: target.height - actual.height)\n                    if abs(offset.width) < 0.24 && abs(offset.height) < 0.24 { return window }\n                    let native = window.contentRect(forFrameRect: window.frame).size\n                    print(\"APPLE_CAPTURE_VIEWPORT observed=\\(actual) native=\\(native) measuredOffset=\\(offset)\")\n                    window.setContentSize(NSSize(width: native.width + offset.width, height: native.height + offset.height))\n                }\n                throw CaptureFailure(\"Native WebView did not settle at the measured target size\")"
          if text.count(old) != 1:
              raise ValueError("Measured AppKit inset fix did not match the pinned test harness.")
          source.write_text(text.replace(old, new))
          PY
          python3 - "$root/audit" <<'PY'
          from pathlib import Path
          import sys
          folder = Path(sys.argv[1])
          changes = [
              ("RuntimeScreenshots.swift", "                try await screenshot(view, window: window, to: output)\n                report(\"APPLE_CAPTURE_FILE \\(frame) \\(label) \\(output.path)\")", "                window.center()\n                NSApplication.shared.activate(ignoringOtherApps: true)\n                window.makeKeyAndOrderFront(nil)\n                window.orderFrontRegardless()\n                try await Task.sleep(for: .milliseconds(1100))\n                let page = try await view.evaluateJavaScript(\"document.visibilityState\") as? String ?? \"unknown\"\n                let visible = window.occlusionState.contains(.visible)\n                report(\"APPLE_CAPTURE_VISIBILITY active=\\(NSApplication.shared.isActive) occlusionVisible=\\(visible) onActiveSpace=\\(window.isOnActiveSpace) document=\\(page)\")\n                guard visible && window.isOnActiveSpace && page == \"visible\",\n                      let screen = window.screen, screen.backingScaleFactor == 1,\n                      let number = screen.deviceDescription[NSDeviceDescriptionKey(\"NSScreenNumber\")] as? NSNumber\n                else { throw CaptureFailure(\"Game window is not visible on an active 1x native display\") }\n                try await screenshot(view, window: window, to: output)\n                let viewFrame = window.convertToScreen(view.convert(view.bounds, to: nil))\n                let display = CGDisplayBounds(CGDirectDisplayID(number.uint32Value))\n                let x = Int((display.minX + viewFrame.minX - screen.frame.minX).rounded())\n                let y = Int((display.minY + screen.frame.maxY - viewFrame.maxY).rounded())\n                let rectangle = \"\\(x),\\(y),\\(desiredWidth),\\(desiredHeight)\"\n                let acknowledgment = output.deletingLastPathComponent()\n                    .appendingPathComponent(\"display-\\(frame)-\\(UUID().uuidString).ack\")\n                report(\"APPLE_CAPTURE_FILE \\(frame) \\(label) \\(rectangle) \\(acknowledgment.path) \\(output.path)\")\n                var acquired = false\n                for _ in 0..<240 {\n                    if FileManager.default.fileExists(atPath: acknowledgment.path) {\n                        acquired = true\n                        break\n                    }\n                    try await Task.sleep(for: .milliseconds(200))\n                }\n                guard acquired else { throw CaptureFailure(\"Independent display capture was not acknowledged\") }\n                try? FileManager.default.removeItem(at: acknowledgment)"),
              ("capture-runner.py", "                    _, frame, label, path = line.split(\" \", 3)\n                    shutil.copyfile(path, output / f\"{frame}-{label}.png\")", "                    _, frame, label, rectangle, ack_path, path = line.split(\" \", 5)\n                    own = Path(path).resolve()\n                    acknowledgment = Path(ack_path).resolve()\n                    if acknowledgment.parent != own.parent or not acknowledgment.name.startswith(f\"display-{frame}-\"):\n                        raise ValueError(\"Independent capture acknowledgment escaped the screenshot folder\")\n                    own_directory = root / \"own-process-comparison\"\n                    own_directory.mkdir(exist_ok=True)\n                    shutil.copyfile(own, own_directory / f\"{frame}-{label}.png\")\n                    target = output / f\"{frame}-{label}.png\"\n                    request = subprocess.run([\"/usr/sbin/screencapture\",\"-x\",\"-t\",\"png\",\"-R\"+rectangle,str(target)],\n                                             timeout=30,capture_output=True,text=True)\n                    print(f\"INDEPENDENT_DISPLAY_CAPTURE exit={request.returncode} rect={rectangle} {request.stderr.strip()}\", flush=True)\n                    if request.returncode or not target.is_file():\n                        raise RuntimeError(\"Independent WindowServer capture produced no image\")\n                    acknowledgment.touch()"),
              ("capture-acceptance.js", "      require(!prior || JSON.stringify(prior.logs) === JSON.stringify(logs), 'Relaunch restored different pieces');", "      const fields = ['n','r','x','z','y','id','span','asset'];\n      const preserved = !prior || (Array.isArray(prior.logs) && prior.logs.length === logs.length &&\n        logs.every((entry, index) => fields.every(field => (entry[field] ?? null) === (prior.logs[index][field] ?? null))));\n      require(preserved, 'Relaunch restored different piece values: '+JSON.stringify({expected:prior?.logs,actual:logs}));"),
          ]
          for name, old, new in changes:
              path = folder / name
              text = path.read_text()
              if text.count(old) != 1:
                  raise ValueError("Independent Mac capture baseline mismatch in " + name)
              path.write_text(text.replace(old, new))
          PY
          python3 "$root/audit/capture-runner.py" prepare "$root" "$APP_KEY" "$SCHEME"
          uname -m
          sw_vers
          system_profiler SPDisplaysDataType
          cat > "$root/audit/native-gl-probe.js" <<'JS'
          (() => {
            const records = [], seen = new WeakSet(), warnings = [];
            let frames = 0, control = null;
            const next = () => { frames++; requestAnimationFrame(next); };
            requestAnimationFrame(next);
            for (const key of ['warn','error']) {
              const original = console[key].bind(console);
              console[key] = (...args) => {
                if (warnings.length < 24) warnings.push([key, ...args.map(x => {
                  try { return String(x).slice(0, 900); } catch { return '[unavailable]'; }
                })]);
                original(...args);
              };
            }
            const pixels = (gl) => {
              const w=gl.drawingBufferWidth,h=gl.drawingBufferHeight,rgba=new Uint8Array(4), found=new Set();
              for (const x of [.22,.41,.60,.78]) for (const y of [.22,.41,.60,.78]) {
                gl.readPixels(Math.round((w-1)*x),Math.round((h-1)*y),1,1,gl.RGBA,gl.UNSIGNED_BYTE,rgba);
                found.add([...rgba].join(','));
              }
              return [...found];
            };
            const original = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function(...args) {
              const gl = Reflect.apply(original,this,args);
              if (!gl || !/^experimental-webgl$|^webgl2?$/.test(String(args[0])) || seen.has(gl) || this.id==='__appleNativeGLControl') return gl;
              seen.add(gl);
              const row = {canvas:this.id||this.className||'(unnamed)',type:args[0],getContext:true,draws:0,observations:[]};
              records.push(row);
              let waiting=false, last=-3000;
              for (const name of ['drawArrays','drawElements','drawArraysInstanced','drawElementsInstanced']) {
                const draw=gl[name]; if (typeof draw!=='function') continue;
                gl[name]=function(...arguments_) {
                  const result=Reflect.apply(draw,this,arguments_);
                  row.draws++;
                  if (!waiting&&performance.now()-last>=850) {
                    waiting=true; last=performance.now();
                    queueMicrotask(()=>{
                      waiting=false;
                      try {
                        const ext=gl.getExtension('WEBGL_debug_renderer_info');
                        const program=gl.getParameter(gl.CURRENT_PROGRAM);
                        const shader=program ? (gl.getAttachedShaders(program)||[]).map(v=>({
                          kind:gl.getShaderParameter(v,gl.SHADER_TYPE), compiled:gl.getShaderParameter(v,gl.COMPILE_STATUS),
                          log:gl.getShaderInfoLog(v)?.slice(0,600)
                        })) : [];
                        const css=this.canvas.getBoundingClientRect();
                        const lost=gl.isContextLost();
                        row.latest={
                          frames,draws:row.draws,lost,dimensions:[gl.drawingBufferWidth,gl.drawingBufferHeight],
                          css:[css.width,css.height],visibility:document.visibilityState,focused:document.hasFocus(),
                          renderer:ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
                          attributes:gl.getContextAttributes(),defaultFramebuffer:gl.getParameter(gl.FRAMEBUFFER_BINDING)===null,
                          linked:program ? gl.getProgramParameter(program,gl.LINK_STATUS):null,
                          linkLog:program ? gl.getProgramInfoLog(program)?.slice(0,700):null,
                          shader, colors:lost||!gl.drawingBufferWidth||!gl.drawingBufferHeight?[]:pixels(gl)
                        };
                        if (row.observations.length<5) row.observations.push(row.latest);
                      } catch(e) { row.error=String(e); }
                    });
                  }
                  return result;
                };
              }
              return gl;
            };
            window.appleNativeGLControl = () => {
              if (control) return control;
              const canvas = document.createElement('canvas');
              canvas.width=96;canvas.height=96;canvas.id='__appleNativeGLControl';
              canvas.setAttribute('style','position:fixed;left:18px;top:100px;width:96px;height:96px;z-index:2147483647;pointer-events:none;');
              document.body.appendChild(canvas);
              const gl=canvas.getContext('webgl2',{alpha:false,antialias:false});
              if (!gl) return control={context:false};
              const shader=(kind,text)=>{
                const s=gl.createShader(kind);gl.shaderSource(s,text);gl.compileShader(s);
                return {s,compiled:gl.getShaderParameter(s,gl.COMPILE_STATUS),log:gl.getShaderInfoLog(s)};
              };
              const vert=shader(gl.VERTEX_SHADER,'#version 300 es\nvoid main(){float x[3]=float[3](-1.0,1.0,0.0);float y[3]=float[3](-1.0,-1.0,1.0);gl_Position=vec4(x[gl_VertexID],y[gl_VertexID],0.0,1.0);}');
              const frag=shader(gl.FRAGMENT_SHADER,'#version 300 es\nprecision highp float;out vec4 pixel;void main(){pixel=vec4(1.0,0.08,0.8,1.0);}');
              const p=gl.createProgram();gl.attachShader(p,vert.s);gl.attachShader(p,frag.s);gl.linkProgram(p);
              const linked=gl.getProgramParameter(p,gl.LINK_STATUS);
              control={context:true,vertexCompiled:vert.compiled,fragmentCompiled:frag.compiled,linked,
                vertexLog:vert.log,fragmentLog:frag.log,linkLog:gl.getProgramInfoLog(p),
                renderer:gl.getParameter(gl.RENDERER),attributes:gl.getContextAttributes()};
              if (linked) {
                const frame=()=>{
                  gl.viewport(0,0,96,96);gl.clearColor(0.05,0.05,0.05,1);gl.clear(gl.COLOR_BUFFER_BIT);
                  gl.useProgram(p);gl.drawArrays(gl.TRIANGLES,0,3);
                  control.colors=pixels(gl);
                  control.lost=gl.isContextLost();
                  requestAnimationFrame(frame);
                };
                frame();
              }
              return control;
            };
            window.appleNativeGLLatest=()=>({frames,visibility:document.visibilityState,focused:document.hasFocus(),control,records,warnings});
          })();
          JS
          python3 - "$root" <<'PY'
          import base64
          import sys
          from pathlib import Path
          root=Path(sys.argv[1])
          session=root/'Sources/GameSession.swift'
          source=session.read_text()
          token='configuration.websiteDataStore = .default()'
          encoded=base64.b64encode((root/'audit/native-gl-probe.js').read_bytes()).decode()
          if source.count(token)!=1: raise ValueError('WKWebView test configuration anchor changed.')
          source=source.replace(token, token+'\n        configuration.userContentController.addUserScript(WKUserScript(source: String(decoding: Data(base64Encoded: "'+encoded+'")!, as: UTF8.self), injectionTime: .atDocumentStart, forMainFrameOnly: true))')
          session.write_text(source)
          runtime=root/'Sources/RuntimeScreenshots.swift'
          text=runtime.read_text().replace('import ScreenCaptureKit','import ScreenCaptureKit\nimport Metal\nimport CoreGraphics')
          text=text.replace('let count = prior is NSNull ? (app == "MyPetSnake" ? 3 : 2) : 0','let count = prior is NSNull ? 1 : 0')
          anchor='                try await screenshot(view, window: window, to: output)'
          if text.count(anchor)!=1: raise ValueError('Native GPU test capture anchor changed.')
          diagnostic = '''                report("APPLE_GPU_METAL default=\\(MTLCreateSystemDefaultDevice()?.name ?? "none") all=\\(MTLCopyAllDevices().map(\\.name))")
                          _ = try await view.evaluateJavaScript("window.appleNativeGLControl()")
                          try await Task.sleep(for: .milliseconds(1100))
                          let probe = try await view.evaluateJavaScript("JSON.stringify(window.appleNativeGLLatest())") as? String ?? "null"
                          report("APPLE_GL_FRAMEBUFFER " + probe)'''
          runtime.write_text(text.replace(anchor, diagnostic.replace("\n                          ","\n                ")+'\n'+anchor))
          PY
          bash "$root/build-unsigned.sh" "$SCHEME"
          if [[ "$SCHEME" == *-Mac ]]; then
            codesign --force --sign - --timestamp=none --entitlements "$root/Apps/$APP_KEY/Mac.entitlements" "$product"
            codesign --verify --strict "$product"
          fi
          cat > "$RUNNER_TEMP/set-capture-display.swift" <<'SWIFT'
          import CoreGraphics
          import Foundation
          
          let display = CGMainDisplayID()
          let options = [kCGDisplayShowDuplicateLowResolutionModes as String: true] as CFDictionary
          let modes = CGDisplayCopyAllDisplayModes(display, options) as? [CGDisplayMode] ?? []
          
          func scale(_ mode: CGDisplayMode) -> Double {
              Double(mode.pixelWidth) / Double(max(1, mode.width))
          }
          func fits(_ mode: CGDisplayMode) -> Bool {
              let factor = scale(mode)
              return Double(mode.width) >= ceil(1440 / factor) + 20 &&
                     Double(mode.height) >= ceil(900 / factor) + 100
          }
          func show(_ mode: CGDisplayMode) -> String {
              "\(mode.width)x\(mode.height) logical at \(scale(mode))x (\(mode.pixelWidth)x\(mode.pixelHeight) pixels)"
          }
          if let active = CGDisplayCopyDisplayMode(display), fits(active) {
              print("APPLE_CAPTURE_DISPLAY \(show(active)) existing mode")
              exit(0)
          }
          
          let choices = modes.filter(fits).sorted {
              ($0.pixelWidth * $0.pixelHeight) < ($1.pixelWidth * $1.pixelHeight)
          }
          for mode in choices {
              var transaction: CGDisplayConfigRef?
              guard CGBeginDisplayConfiguration(&transaction) == .success else { continue }
              if CGConfigureDisplayWithDisplayMode(transaction, display, mode, nil) != .success {
                  CGCancelDisplayConfiguration(transaction)
                  continue
              }
              if CGCompleteDisplayConfiguration(transaction, .forSession) == .success,
                 let active = CGDisplayCopyDisplayMode(display), fits(active) {
                  print("APPLE_CAPTURE_DISPLAY \(show(active)) selected for this runner session")
                  exit(0)
              }
          }
          print("No Mac runner display mode can fit a native 1440x900 game viewport.")
          for mode in modes.prefix(20) { print("APPLE_DISPLAY_AVAILABLE \(show(mode))") }
          exit(1)
          SWIFT
          /usr/bin/swift "$RUNNER_TEMP/set-capture-display.swift"
          sleep 2
          "$RUNNER_TEMP/cryptoenv/bin/python" "$root/audit/capture-runner.py" invoke "$product" "$APP_KEY" "$BUNDLE" "$DEVICE"
      - name: Encrypt App Store screenshots and diagnostic receipts
        if: always()
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        run: |
          set -euo pipefail
          if [[ ! -x "$RUNNER_TEMP/cryptoenv/bin/python" ]]; then exit 0; fi
          "$RUNNER_TEMP/cryptoenv/bin/python" - <<'PY'
          import os
          from pathlib import Path
          import shutil
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          root = Path(os.environ['RUNNER_TEMP'])
          cipher = AESGCM(bytes.fromhex(os.environ['IPA_KEY_HEX']))
          captures = root / 'captures'
          if captures.is_dir():
              shutil.make_archive(str(root/'screenshots-native'), 'zip', captures)
          own = root / 'own-process-comparison'
          if own.is_dir():
              shutil.make_archive(str(root/'own-process-comparison'), 'zip', own)
          for name in ('capture.log', 'screenshots-native.zip', 'own-process-comparison.zip'):
              if (root / name).exists():
                  nonce = os.urandom(12)
                  (root / (name+'.aesgcm')).write_bytes(nonce + cipher.encrypt(nonce, (root / name).read_bytes(), None))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.slot }}-webgl-diagnostic-encrypted
          path: |
            ${{ runner.temp }}/capture.log.aesgcm
            ${{ runner.temp }}/screenshots-native.zip.aesgcm
            ${{ runner.temp }}/own-process-comparison.zip.aesgcm
          retention-days: 1
          if-no-files-found: ignore