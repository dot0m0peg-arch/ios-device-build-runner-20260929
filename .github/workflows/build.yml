name: Sophia iOS 2.2.2 build 17 audio release v4

on: workflow_dispatch

permissions:

  contents: read

jobs:

  release:
    if: github.repository == 'dot0m0peg-arch/ios-device-build-runner-20260929' && github.ref == 'refs/heads/claude/sophia-audio-build17-v4-20261125'

    runs-on: xcode-27

    timeout-minutes: 150

    strategy:

      fail-fast: false

      max-parallel: 2

      matrix:

        include:

          - {app: SophiasSightWords, platform: IOS}

    env:

      APP_KEY: ${{ matrix.app }}

      PLATFORM: ${{ matrix.platform }}

    steps:

      - name: Select stable Xcode 27 and iPhoneOS SDK 27
        shell: bash
        run: |
          set -euo pipefail
          chosen=''
          for app in /Applications/Xcode_27.2.app; do
            developer="$app/Contents/Developer"
            [[ -x "$developer/usr/bin/xcodebuild" ]] || continue
            if ! info="$(DEVELOPER_DIR="$developer" xcodebuild -version)"; then continue; fi
            version="$(printf '%s\n' "$info" | awk '/^Xcode / {print $2}')"
            build="$(printf '%s\n' "$info" | awk '/^Build version / {print $3}')"
            if ! sdk="$(DEVELOPER_DIR="$developer" xcrun --sdk iphoneos --show-sdk-version)"; then continue; fi
            case "$version|$build|$sdk" in
              '27.2|27B52|27.2') ;;
              *) continue ;;
            esac
            chosen="$developer"
            break
          done
          if [[ -z "$chosen" ]]; then
            echo 'The runner has no allowlisted stable Xcode 27 / iPhoneOS 27 toolchain.' >&2
            exit 1
          fi
          {
            printf 'DEVELOPER_DIR=%s\n' "$chosen"
            printf 'SOPHIA_RELEASE_XCODE_VERSION=%s\n' "$version"
            printf 'SOPHIA_RELEASE_XCODE_BUILD=%s\n' "$build"
            printf 'SOPHIA_RELEASE_IPHONE_SDK=%s\n' "$sdk"
          } >> "$GITHUB_ENV"
          printf 'Selected stable Xcode %s (%s) with iPhoneOS SDK %s.\n' "$version" "$build" "$sdk"

      - name: Prepare trusted build tools

        run: |

          set -euo pipefail

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

          brew install xcodegen

          python3 -m venv "$RUNNER_TEMP/cryptoenv"

          "$RUNNER_TEMP/cryptoenv/bin/pip" install --quiet cryptography==50.0.1

      - name: Decrypt exact release inputs

        env:

          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}

          GH_TOKEN: ${{ github.token }}

        run: |

          set -euo pipefail

          "$RUNNER_TEMP/cryptoenv/bin/python" - <<'PY'

          from io import BytesIO

          from pathlib import Path

          from zipfile import ZipFile

          from urllib.request import Request,urlopen

          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          import hashlib,json,os

          app=os.environ['APP_KEY']

          repo=os.environ['GITHUB_REPOSITORY']

          sha=os.environ['GITHUB_SHA']

          api='https://api.github.com/repos/'+repo+'/git/trees/'+sha+'?recursive=1'

          req=Request(api,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})

          with urlopen(req,timeout=60) as response:tree=json.load(response)

          assert not tree.get('truncated',False)

          files={v['path']:v['sha'] for v in tree['tree'] if v['type']=='blob'}

          cipher=AESGCM(bytes.fromhex(os.environ['IPA_KEY_HEX']))

          def download(name):

              with urlopen('https://raw.githubusercontent.com/'+repo+'/'+sha+'/'+name,timeout=180) as response:data=response.read()

              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\x00'+data).hexdigest()

              assert expected==files[name],'Git object identity mismatch'

              return data

          encrypted=download('apple-port/sophia-store-sdk27-audio-build17-v4/source.aesgcm')

          patch=cipher.decrypt(encrypted[:12],encrypted[12:],b'sophia-store-sdk27-audio-build17-v4-20261125')

          root=Path(os.environ['RUNNER_TEMP'])/'apple-source'

          root.mkdir()

          with ZipFile(BytesIO(patch)) as layer:

              for name in layer.namelist():assert (root/name).resolve().is_relative_to(root.resolve())

              layer.extractall(root)

          expected=json.loads((root/'release/expected-source-hashes.json').read_text())
          actual={p.relative_to(root).as_posix() for p in root.rglob('*')
                  if p.is_file() and p.relative_to(root).parts[0]!='release'}
          assert set(expected)==actual,'Sophia source member set mismatch'

          for name,digest in expected.items():

              assert hashlib.file_digest((root/name).open('rb'),'sha256').hexdigest()==digest,'Sophia source integrity mismatch'

          print(app+': source integrity verified.')

          PY

      - name: Qualify exact audio source with SwiftPM and app-hosted XCTest
        shell: bash
        run: |
          set -euo pipefail
          python="$RUNNER_TOOL_CACHE/Python/3.12.10/arm64/bin/python3"
          test -x "$python"
          test "$("$python" --version)" = 'Python 3.12.10'
          "$python" "$RUNNER_TEMP/apple-source/release/run_audio_preflight.py"

      - name: Verify Light and Dark reward flow and the parent audio request on iPhone
        shell: bash
        run: |
          set -euo pipefail
          python="$RUNNER_TOOL_CACHE/Python/3.12.10/arm64/bin/python3"
          test -x "$python"
          test "$("$python" --version)" = 'Python 3.12.10'
          "$python" "$RUNNER_TEMP/apple-source/release/run_reward_regression.py"

      - name: Sign validate and upload release candidate

        env:

          APPLE_DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}

          APPLE_INSTALLER_P12: ${{ secrets.APPLE_INSTALLER_P12 }}

          APPLE_SIGNING_P12_PASSWORD: ${{ secrets.APPLE_SIGNING_P12_PASSWORD }}

          APPLE_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPLE_STORE_CONNECT_PRIVATE_KEY }}

          APPLE_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_STORE_CONNECT_KEY_ID }}

          APPLE_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_STORE_CONNECT_ISSUER_ID }}

        run: |
          "$RUNNER_TOOL_CACHE/Python/3.12.10/arm64/bin/python3" "$RUNNER_TEMP/apple-source/release/build_release.py"

      - name: Encrypt packages and diagnostics

        if: always()

        env:

          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}

        run: |

          set -euo pipefail

          if [[ ! -x "$RUNNER_TEMP/cryptoenv/bin/python" ]]; then exit 0; fi

          "$RUNNER_TEMP/cryptoenv/bin/python" - <<'PY'

          from pathlib import Path

          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          import os

          root=Path(os.environ['RUNNER_TEMP'])

          dest=root/'encrypted-release'

          dest.mkdir(exist_ok=True)

          cipher=AESGCM(bytes.fromhex(os.environ['IPA_KEY_HEX']))

          for p in (root/'release-output').glob('*'):

              if p.is_file():

                  nonce=os.urandom(12)

                  (dest/(p.name+'.aesgcm')).write_bytes(nonce+cipher.encrypt(nonce,p.read_bytes(),None))

          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02

        if: always()

        with:

          name: ${{ matrix.app }}-signed-release-encrypted

          path: ${{ runner.temp }}/encrypted-release/*.aesgcm

          retention-days: 3

          if-no-files-found: ignore
