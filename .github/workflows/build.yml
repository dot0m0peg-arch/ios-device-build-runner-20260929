name: Apple game build check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        scheme: [MyPetSnake-iOS, Timbersack-Mac]
    env:
      SCHEME: ${{ matrix.scheme }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare native build tools
        run: |
          set -euo pipefail
          xcodebuild -version
          brew install xcodegen
          python3 -m venv "$RUNNER_TEMP/cryptoenv"
          "$RUNNER_TEMP/cryptoenv/bin/pip" install --quiet cryptography==50.0.1
      - name: Decrypt verified game payload
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cryptoenv/bin/python" - <<'PY'
          import io, os
          from pathlib import Path
          from zipfile import ZipFile
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          data = Path('apple-port/candidate.aesgcm').read_bytes()
          key = bytes.fromhex(os.environ['IPA_KEY_HEX'])
          payload = AESGCM(key).decrypt(data[:12], data[12:], None)
          root = (Path(os.environ['RUNNER_TEMP']) / 'apple-source').resolve()
          root.mkdir()
          with ZipFile(io.BytesIO(payload)) as package:
              for name in package.namelist():
                  if not (root / name).resolve().is_relative_to(root):
                      raise ValueError('Game source entry is outside its directory')
              package.extractall(root)
          PY
      - name: Compile and verify packaged game resources
        run: |
          set -euo pipefail
          [[ "$SCHEME" == MyPetSnake-iOS || "$SCHEME" == Timbersack-Mac ]]
          root="$RUNNER_TEMP/apple-source"
          product="$root/build/$SCHEME/products/${SCHEME%-*}.app"
          bash "$root/build-unsigned.sh" "$SCHEME" > "$RUNNER_TEMP/compile.log" 2>&1
          ditto -c -k --keepParent "$product" "$RUNNER_TEMP/unsigned-app.zip"
          echo "Xcode compiled $SCHEME and verified the bundled payload."
      - name: Encrypt build and diagnostics
        if: always()
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        run: |
          set -euo pipefail
          if [[ ! -x "$RUNNER_TEMP/cryptoenv/bin/python" ]]; then exit 0; fi
          "$RUNNER_TEMP/cryptoenv/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          root = Path(os.environ['RUNNER_TEMP'])
          cipher = AESGCM(bytes.fromhex(os.environ['IPA_KEY_HEX']))
          for name in ['unsigned-app.zip', 'compile.log']:
              path = root / name
              if path.is_file():
                  nonce = os.urandom(12)
                  (root / f'{name}.aesgcm').write_bytes(nonce + cipher.encrypt(nonce, path.read_bytes(), None))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.scheme }}-encrypted
          path: ${{ runner.temp }}/*.aesgcm
          retention-days: 1
          if-no-files-found: ignore
