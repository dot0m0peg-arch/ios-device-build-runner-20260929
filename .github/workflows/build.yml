name: Apple portfolio sandboxed game startup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {app: LastCarUpright, scheme: LastCarUpright-Mac}
          - {app: Miner3D, scheme: Miner3D-Mac}
          - {app: QuicksilverPennies, scheme: QuicksilverPennies-Mac}
    env:
      APP_KEY: ${{ matrix.app }}
      SCHEME: ${{ matrix.scheme }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            apple-port/${{ matrix.app }}
            apple-port/probe
      - name: Prepare native build tools
        run: |
          set -euo pipefail
          xcodebuild -version
          brew install xcodegen
          python3 -m venv "$RUNNER_TEMP/cryptoenv"
          "$RUNNER_TEMP/cryptoenv/bin/pip" install --quiet cryptography==50.0.1
      - name: Decrypt verified game payload
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cryptoenv/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          segments = sorted((Path('apple-port') / os.environ['APP_KEY']).glob('*.aesgcm'))
          if not segments:
              raise ValueError('No encrypted source segments')
          root = (Path(os.environ['RUNNER_TEMP']) / 'apple-source').resolve()
          root.mkdir()
          cipher = AESGCM(bytes.fromhex(os.environ['IPA_KEY_HEX']))
          archive = root.parent / 'source.zip'
          with archive.open('wb') as output:
              for index, path in enumerate(segments):
                  if path.stem != f'{index:03d}':
                      raise ValueError('Invalid segment index')
                  data = path.read_bytes()
                  context = f"{os.environ['APP_KEY']}:{index}".encode()
                  output.write(cipher.decrypt(data[:12], data[12:], context))
          with ZipFile(archive) as package:
              for name in package.namelist():
                  if not (root / name).resolve().is_relative_to(root):
                      raise ValueError('Source entry is outside its directory')
              package.extractall(root)
          PY
      - name: Launch the sandboxed Mac game and verify WebGL and local storage
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/apple-source"
          product="$root/build/$SCHEME/products/$APP_KEY.app"
          output="$RUNNER_TEMP/apple-runtime.txt"
          errors="$RUNNER_TEMP/apple-runtime-errors.txt"
          exec > "$RUNNER_TEMP/compile.log" 2>&1
          python3 apple-port/probe/overlay.py "$root" "$APP_KEY"
          bash "$root/build-unsigned.sh" "$SCHEME"
          codesign --force --sign - --timestamp=none \
              --entitlements "$root/Apps/$APP_KEY/Mac.entitlements" "$product"
          touch "$output" "$errors"
          python3 - "$product" "$output" "$errors" <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          product, output, errors = sys.argv[1:]
          command = ['/usr/bin/open', '-W', '-n', '--stdout', output, '--stderr', errors, product]
          subprocess.run(command, timeout=110, check=True)
          text = Path(output).read_text(errors='replace') + Path(errors).read_text(errors='replace')
          print(text)
          if 'APPLE_RUNTIME_SMOKE_PASS' not in text:
              raise SystemExit(1)
          PY
      - name: Encrypt build and diagnostics
        if: always()
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        run: |
          set -euo pipefail
          if [[ ! -x "$RUNNER_TEMP/cryptoenv/bin/python" ]]; then exit 0; fi
          "$RUNNER_TEMP/cryptoenv/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          root = Path(os.environ['RUNNER_TEMP'])
          cipher = AESGCM(bytes.fromhex(os.environ['IPA_KEY_HEX']))
          for name in ['unsigned-app.zip', 'compile.log']:
              path = root / name
              if path.is_file():
                  nonce = os.urandom(12)
                  (root / f'{name}.aesgcm').write_bytes(nonce + cipher.encrypt(nonce, path.read_bytes(), None))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.scheme }}-encrypted
          path: ${{ runner.temp }}/*.aesgcm
          retention-days: 1
          if-no-files-found: ignore
