name: Diagnose native Last Car media from its preserved SDK 27 signed package
on: workflow_dispatch
permissions:
  contents: read
  actions: read
env:
  APP_KEY: LastCarUpright
  PLATFORM: MAC_OS
jobs:
  companion:
    if: github.repository == 'dot0m0peg-arch/ios-device-build-runner-20260929' && github.ref == 'refs/heads/codex/lastcar-native-replay-20261119'
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Get exact diagnostics and stable Xcode 27.2 tools
        shell: bash
        run: |
          set -euo pipefail
          dev=/Applications/Xcode_27.2.app/Contents/Developer
          export DEVELOPER_DIR="$dev"
          [[ "$(xcodebuild -version)" == $'Xcode 27.2\nBuild version 27B52' ]]
          [[ "$(xcrun --sdk macosx --show-sdk-version)" == '27.2' ]]
          echo "DEVELOPER_DIR=$dev" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/lastcar-diagnostic-tools"
          cd "$RUNNER_TEMP/lastcar-diagnostic-tools"
          url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/apple-port/lastcar-native-replay/tools"
          for name in verify_release.py artifacts.py prepare_qa.py lastcar_replay.py run_native_qa.py diagnostic-pins.json tool-hashes.sha256; do
            curl --fail --silent --show-error --retry 2 --max-time 80 "$url/$name" -o "$name"
          done
          shasum -a 256 -c tool-hashes.sha256
          command -v xcodegen >/dev/null || brew install xcodegen
          python3 -m venv "$RUNNER_TEMP/cryptoenv"
          "$RUNNER_TEMP/cryptoenv/bin/pip" install --quiet --retries 3 --timeout 20 cryptography==50.0.1
      - name: Authenticate the unchanged encrypted source and build the diagnostic companion only
        shell: bash
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cryptoenv/bin/python" "$RUNNER_TEMP/lastcar-diagnostic-tools/artifacts.py" source
          "$RUNNER_TEMP/cryptoenv/bin/python" "$RUNNER_TEMP/lastcar-diagnostic-tools/lastcar_replay.py" build
      - name: Encrypt the diagnostic companion only
        if: always()
        shell: bash
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/mac-job-products"
          if [[ ! -d "$source" ]]; then exit 0; fi
          "$RUNNER_TEMP/cryptoenv/bin/python" "$RUNNER_TEMP/lastcar-diagnostic-tools/artifacts.py" encrypt "$source" "$RUNNER_TEMP/lastcar-encrypted-companion" build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: LastCarUpright-sdk27-native-replay-companion-encrypted
          path: ${{ runner.temp }}/lastcar-encrypted-companion/*.aesgcm
          retention-days: 3
          if-no-files-found: ignore
  diagnose:
    if: github.repository == 'dot0m0peg-arch/ios-device-build-runner-20260929' && github.ref == 'refs/heads/codex/lastcar-native-replay-20261119'
    needs: companion
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Get exact diagnostic tools on the known native display runner
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          [[ "$(sw_vers -productVersion)" == 15.* ]]
          export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/lastcar-diagnostic-tools"
          cd "$RUNNER_TEMP/lastcar-diagnostic-tools"
          url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/apple-port/lastcar-native-replay/tools"
          for name in verify_release.py artifacts.py prepare_qa.py lastcar_replay.py run_native_qa.py diagnostic-pins.json tool-hashes.sha256; do
            curl --fail --silent --show-error --retry 2 --max-time 80 "$url/$name" -o "$name"
          done
          shasum -a 256 -c tool-hashes.sha256
          python3 -m venv "$RUNNER_TEMP/cryptoenv"
          "$RUNNER_TEMP/cryptoenv/bin/pip" install --quiet --retries 3 --timeout 20 cryptography==50.0.1 Pillow==12.2.0
      - name: Download the original unchanged signed installer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '14526314216'
          run-id: '44519418398'
          github-token: ${{ github.token }}
          merge-multiple: 'true'
          path: ${{ runner.temp }}/lastcar-encrypted-original
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: LastCarUpright-sdk27-native-replay-companion-encrypted
          path: ${{ runner.temp }}/lastcar-encrypted-companion
      - name: Authenticate both exact artifacts and diagnose native playback
        shell: bash
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/lastcar-encrypted-original-selected"
          for file in LastCarUpright.pkg.aesgcm source-and-package.json.aesgcm; do
            mv "$RUNNER_TEMP/lastcar-encrypted-original/$file" "$RUNNER_TEMP/lastcar-encrypted-original-selected/$file"
          done
          py="$RUNNER_TEMP/cryptoenv/bin/python"
          code="$RUNNER_TEMP/lastcar-diagnostic-tools"
          GITHUB_RUN_ID=44519418398 "$py" "$code/artifacts.py" decrypt "$RUNNER_TEMP/lastcar-encrypted-original-selected" "$RUNNER_TEMP/original-package-products" build
          "$py" "$code/artifacts.py" decrypt "$RUNNER_TEMP/lastcar-encrypted-companion" "$RUNNER_TEMP/diagnostic-companion-products" build
          env -u IPA_KEY_HEX "$py" "$code/lastcar_replay.py" qualify
      - name: Encrypt native diagnostics, screenshots and unresolved checks
        if: always()
        shell: bash
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/mac-qa-products"
          if [[ ! -d "$source" ]]; then exit 0; fi
          "$RUNNER_TEMP/cryptoenv/bin/python" "$RUNNER_TEMP/lastcar-diagnostic-tools/artifacts.py" encrypt "$source" "$RUNNER_TEMP/lastcar-encrypted-diagnostics" qa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: LastCarUpright-sdk27-native-replay-evidence-encrypted
          path: ${{ runner.temp }}/lastcar-encrypted-diagnostics/*.aesgcm
          retention-days: 3
          if-no-files-found: ignore
