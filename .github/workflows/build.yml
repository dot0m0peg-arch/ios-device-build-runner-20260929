name: Inspect and File native qualification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'dot0m0peg-arch/ios-device-build-runner-20260929' && startsWith(github.ref, 'refs/heads/codex/inspect-and-file-')
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify SDK and open encrypted source
        shell: bash
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer
          [[ "$(xcodebuild -version)" == $'Xcode 27.2\nBuild version 27B52' ]]
          [[ "$(xcrun --sdk iphoneos --show-sdk-version)" == '27.2' ]]
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          command -v xcodegen >/dev/null || brew install xcodegen
          python3 -m venv "$RUNNER_TEMP/cryptoenv"
          "$RUNNER_TEMP/cryptoenv/bin/pip" install --quiet --retries 3 --timeout 20 cryptography==50.0.1
          cd apple-port/inspect-and-file
          shasum -a 256 -c tool-hashes.sha256
          "$RUNNER_TEMP/cryptoenv/bin/python" transport.py unpack source.aesgcm "$RUNNER_TEMP/inspect-source" --sha256 "$(cat source.sha256)"
      - name: Compile and exercise native app
        timeout-minutes: 26
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inspect-products"
          cd "$RUNNER_TEMP/inspect-source"
          export INSPECT_OUTPUT_DIR="$RUNNER_TEMP/inspect-products"
          export RUN_UI_TESTS=1
          export KEEP_SIMULATOR_APP=1
          bash scripts/check.sh > "$INSPECT_OUTPUT_DIR/check.log" 2>&1 || { tail -n 70 "$INSPECT_OUTPUT_DIR/check.log"; exit 1; }
          tail -n 35 "$INSPECT_OUTPUT_DIR/check.log"
      - name: Encrypt qualification results
        if: always()
        shell: bash
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        run: |
          set -euo pipefail
          if [[ -d "$RUNNER_TEMP/inspect-products" && -x "$RUNNER_TEMP/cryptoenv/bin/python" ]]; then
            "$RUNNER_TEMP/cryptoenv/bin/python" apple-port/inspect-and-file/transport.py pack "$RUNNER_TEMP/inspect-products" "$RUNNER_TEMP/inspect-encrypted/qualification.aesgcm"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: inspect-and-file-native-encrypted
          path: ${{ runner.temp }}/inspect-encrypted/*.aesgcm
          retention-days: 3
          if-no-files-found: ignore