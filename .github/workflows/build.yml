name: Apple game portfolio builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {app: MyPetSnake, scheme: MyPetSnake-Mac, save_app: true}
          - {app: Timbersack, scheme: Timbersack-iOS, save_app: true}
          - {app: LastCarUpright, scheme: LastCarUpright-Mac, save_app: true}
          - {app: LastCarUpright, scheme: LastCarUpright-iOS, save_app: false}
          - {app: Miner3D, scheme: Miner3D-Mac, save_app: true}
          - {app: Miner3D, scheme: Miner3D-iOS, save_app: false}
          - {app: QuicksilverPennies, scheme: QuicksilverPennies-Mac, save_app: true}
    env:
      APP_KEY: ${{ matrix.app }}
      SCHEME: ${{ matrix.scheme }}
      SAVE_APP: ${{ matrix.save_app }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: apple-port/${{ matrix.app }}
      - name: Prepare native build tools
        run: |
          set -euo pipefail
          xcodebuild -version
          brew install xcodegen
          python3 -m venv "$RUNNER_TEMP/cryptoenv"
          "$RUNNER_TEMP/cryptoenv/bin/pip" install --quiet cryptography==50.0.1
      - name: Decrypt verified game payload
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cryptoenv/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          segments = sorted((Path('apple-port') / os.environ['APP_KEY']).glob('*.aesgcm'))
          if not segments:
              raise ValueError('No encrypted source segments')
          root = (Path(os.environ['RUNNER_TEMP']) / 'apple-source').resolve()
          root.mkdir()
          cipher = AESGCM(bytes.fromhex(os.environ['IPA_KEY_HEX']))
          archive = root.parent / 'source.zip'
          with archive.open('wb') as output:
              for index, path in enumerate(segments):
                  if path.stem != f'{index:03d}':
                      raise ValueError('Invalid segment index')
                  data = path.read_bytes()
                  context = f"{os.environ['APP_KEY']}:{index}".encode()
                  output.write(cipher.decrypt(data[:12], data[12:], context))
          with ZipFile(archive) as package:
              for name in package.namelist():
                  if not (root / name).resolve().is_relative_to(root):
                      raise ValueError('Source entry is outside its directory')
              package.extractall(root)
          PY
      - name: Compile and verify packaged game resources
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/apple-source"
          product="$root/build/$SCHEME/products/$APP_KEY.app"
          bash "$root/build-unsigned.sh" "$SCHEME" > "$RUNNER_TEMP/compile.log" 2>&1
          if [[ "$SAVE_APP" == true ]]; then
            ditto -c -k --keepParent "$product" "$RUNNER_TEMP/unsigned-app.zip"
          fi
          echo "Xcode compiled $SCHEME and verified the bundled payload."
      - name: Encrypt build and diagnostics
        if: always()
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        run: |
          set -euo pipefail
          if [[ ! -x "$RUNNER_TEMP/cryptoenv/bin/python" ]]; then exit 0; fi
          "$RUNNER_TEMP/cryptoenv/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          root = Path(os.environ['RUNNER_TEMP'])
          cipher = AESGCM(bytes.fromhex(os.environ['IPA_KEY_HEX']))
          for name in ['unsigned-app.zip', 'compile.log']:
              path = root / name
              if path.is_file():
                  nonce = os.urandom(12)
                  (root / f'{name}.aesgcm').write_bytes(nonce + cipher.encrypt(nonce, path.read_bytes(), None))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.scheme }}-encrypted
          path: ${{ runner.temp }}/*.aesgcm
          retention-days: 1
          if-no-files-found: ignore
