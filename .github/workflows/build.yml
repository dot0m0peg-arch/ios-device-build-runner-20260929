name: Validate and upload one accepted original Mac package
on:
  workflow_dispatch:
    inputs:
      title:
        description: Exact approved Mac package
        type: choice
        options: [LastCarUpright, Miner3D]
        required: true
      package_sha256:
        description: Hash of the independently verified, already signed installer
        type: string
        required: true
      native_run:
        description: Root-approved native qualification run
        type: string
        required: true
      native_sha256:
        description: SHA-256 of the reviewed passing native report
        type: string
        required: true
permissions:
  contents: read
  actions: read
env:
  APP_KEY: ${{ inputs.title }}
  APPROVED_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
  APPROVED_NATIVE_RUN: ${{ inputs.native_run }}
  APPROVED_NATIVE_SHA256: ${{ inputs.native_sha256 }}
jobs:
  upload:
    if: github.repository == 'dot0m0peg-arch/ios-device-build-runner-20260929' && github.ref == 'refs/heads/codex/polished-mac-package-upload-20261119'
    runs-on: xcode-27
    timeout-minutes: 33
    steps:
      - name: Authenticate exact package-only upload script
        shell: bash
        run: |
          set -euo pipefail
          dev=/Applications/Xcode_27.2.app/Contents/Developer
          export DEVELOPER_DIR="$dev"
          [[ "$(xcodebuild -version)" == $'Xcode 27.2\nBuild version 27B52' ]]
          [[ "$(xcrun --sdk macosx --show-sdk-version)" == 27.2 ]]
          echo "DEVELOPER_DIR=$dev" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP"
          url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/apple-port/polished-mac-package-upload/upload_exact_mac_pkg.py"
          curl --fail --silent --show-error --retry 2 --max-time 90 "$url" -o upload_exact_mac_pkg.py
          printf '%s  %s\n' 'ac966d892a209e2c26e1371d182d7a273fc17cf37b55dd1c952c2e3f6b20746e' 'upload_exact_mac_pkg.py' | shasum -a 256 -c
          python3 -m venv "$RUNNER_TEMP/cryptoenv"
          "$RUNNER_TEMP/cryptoenv/bin/pip" install --quiet --retries 3 --timeout 20 cryptography==50.0.1
      - name: Download the original Last Car signed package
        if: inputs.title == 'LastCarUpright'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '14526314216'
          run-id: '44519418398'
          github-token: ${{ github.token }}
          merge-multiple: 'true'
          path: ${{ runner.temp }}/signed-encrypted
      - name: Download the original Miner signed package
        if: inputs.title == 'Miner3D'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '14525664866'
          run-id: '44517353220'
          github-token: ${{ github.token }}
          merge-multiple: 'true'
          path: ${{ runner.temp }}/signed-encrypted
      - name: Verify, validate and upload only the unchanged signed package
        shell: bash
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
          APPLE_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPLE_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_STORE_CONNECT_KEY_ID }}
          APPLE_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cryptoenv/bin/python" "$RUNNER_TEMP/upload_exact_mac_pkg.py" upload
      - name: Encrypt validation and Apple upload receipts
        if: always()
        shell: bash
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/upload_exact_mac_pkg.py"
          if [[ ! -d "$RUNNER_TEMP/apple-upload-report" ]]; then exit 0; fi
          "$RUNNER_TEMP/cryptoenv/bin/python" "$script" preserve
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.title }}-original-pkg-upload-receipt-encrypted
          path: ${{ runner.temp }}/apple-upload-encrypted/*.aesgcm
          retention-days: 3
          if-no-files-found: ignore
