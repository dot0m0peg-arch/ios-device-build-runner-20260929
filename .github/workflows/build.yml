name: Sophia original native shared-race build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Decrypt original Sophia source
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/cryptoenv"
          "$RUNNER_TEMP/cryptoenv/bin/pip" install --quiet cryptography==50.0.1
          "$RUNNER_TEMP/cryptoenv/bin/python" - <<'PY'
          import os, io, zipfile
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          raw = Path('connor/source.zip.aesgcm').read_bytes()
          plain = AESGCM(bytes.fromhex(os.environ['IPA_KEY_HEX'])).decrypt(raw[:12], raw[12:], None)
          target = Path(os.environ['RUNNER_TEMP']) / 'connor-source'
          with zipfile.ZipFile(io.BytesIO(plain)) as z:
              for name in z.namelist():
                  path = (target / name).resolve()
                  if not path.is_relative_to(target.resolve()):
                      raise ValueError('Source path outside package')
              z.extractall(target)
          PY
      - name: Compile and package bundled iPhone app
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/connor-source"
          python3 native-test.py > "$RUNNER_TEMP/connor-build.log" 2>&1
          swift test >> "$RUNNER_TEMP/connor-build.log" 2>&1
          xcodebuild -project SophiasSightWords.xcodeproj -scheme SophiasSightWords -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO build >> "$RUNNER_TEMP/connor-build.log" 2>&1
          mkdir -p "$RUNNER_TEMP/connor-output/Payload"
          cp -R "$RUNNER_TEMP/derived/Build/Products/Debug-iphoneos/SophiasSightWords.app" "$RUNNER_TEMP/connor-output/Payload/"
          cd "$RUNNER_TEMP/connor-output"
          zip -qry Sophia-Shared-Race-unsigned.ipa Payload
      - name: Encrypt output and diagnostics
        if: always()
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cryptoenv/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root = Path(os.environ['RUNNER_TEMP'])
          cipher = AESGCM(bytes.fromhex(os.environ['IPA_KEY_HEX']))
          for name in ['connor-output/Sophia-Shared-Race-unsigned.ipa', 'connor-build.log']:
              path = root / name
              if path.exists():
                  nonce = os.urandom(12)
                  (root / (path.name + '.aesgcm')).write_bytes(nonce + cipher.encrypt(nonce, path.read_bytes(), None))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connor-encrypted-device-build
          path: ${{ runner.temp }}/Sophia-Shared-Race-unsigned.ipa.aesgcm
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connor-encrypted-build-log
          path: ${{ runner.temp }}/connor-build.log.aesgcm
          retention-days: 1
          if-no-files-found: ignore
