name: Verify Snake iPad persistence with cold XCTest startup allowance
on: workflow_dispatch
permissions:
  contents: read
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {app: MyPetSnake, scheme: MyPetSnake-iOS, bundle: com.mypetsnake.game, device: 'iPad Pro 13-inch (M5)', slot: Snake-iPad}
    env:
      APP_KEY: ${{ matrix.app }}
      DEVICE: ${{ matrix.device }}
      SLOT: ${{ matrix.slot }}
      CANDIDATE_GAME_MANIFEST_SHA256: 7652e97fc920e8a86568af6398af22f6f71957193c7500f7635e542ebd987fd5
      CANDIDATE_DELTA_SHA256: 11ee5d10656c095dee8e237eff47050e4c7091cdc4a6a20bae900565dcd95e49
      CANDIDATE_SOURCE_SHA256: efa918dd1d881acac477bb21ea41705746bea933e8402b5b55d5741c6af04a27
      BASE_REF: e3e971e44dd6f468fb7b576ab98c3016ca71b8d3
    steps:
      - name: Prepare Xcode and fetch only required encrypted files
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        run: |
          set -euo pipefail
          exec >> "$RUNNER_TEMP/capture.log" 2>&1
          xcodebuild -version
          brew install xcodegen
          python3 -m venv "$RUNNER_TEMP/cryptoenv"
          "$RUNNER_TEMP/cryptoenv/bin/pip" install --quiet cryptography==50.0.1 'pillow>=12.2,<13'
          "$RUNNER_TEMP/cryptoenv/bin/python" - <<'PY'
          import hashlib
          from io import BytesIO
          import json
          import os
          from pathlib import Path
          import subprocess
          from zipfile import ZipFile
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from concurrent.futures import ThreadPoolExecutor

          root = Path(os.environ['RUNNER_TEMP']).resolve() / 'capture-source'
          root.mkdir()
          app = os.environ['APP_KEY']
          remote = 'https://raw.githubusercontent.com/' + os.environ['GITHUB_REPOSITORY']
          cipher = AESGCM(bytes.fromhex(os.environ['IPA_KEY_HEX']))

          def fetch(ref, path):
              return subprocess.run(['curl', '--fail', '--silent', '--show-error',
                  '--retry', '2', '--max-time', '110', f'{remote}/{ref}/{path}'],
                  check=True, capture_output=True, timeout=120).stdout

          def checked_extract(archive):
              for name in archive.namelist():
                  if not (root / name).resolve().is_relative_to(root):
                      raise ValueError('Archive entry escaped its directory.')
              archive.extractall(root)

          encrypted = fetch(os.environ['GITHUB_SHA'], 'apple-port/final-capture-audit/overlay.aesgcm')
          patch = cipher.decrypt(encrypted[:12], encrypted[12:], b'final-capture-acceptance')
          with ZipFile(BytesIO(patch)) as overlay:
              expect = json.loads(overlay.read('audit/payload-index.json'))[app]

              def segment(index):
                  raw = fetch(os.environ['BASE_REF'], f'apple-port/{app}/{index:03d}.aesgcm')
                  return cipher.decrypt(raw[:12], raw[12:], f'{app}:{index}'.encode())

              base = root.parent / 'game-source.zip'
              with base.open('wb') as output, ThreadPoolExecutor(max_workers=3) as pool:
                  for plain in pool.map(segment, range(expect['segments'])):
                      output.write(plain)
              with ZipFile(base) as original:
                  checked_extract(original)
              checked_extract(overlay)

          actual = {}
          game = root / 'Apps' / app / 'game'
          for file in game.rglob('*'):
              if file.is_file():
                  with file.open('rb') as stream:
                      actual[file.relative_to(root).as_posix()] = hashlib.file_digest(stream, 'sha256').hexdigest()
          if expect['files'] != actual:
              raise ValueError('Exactly packaged game files did not match the released payload.')
          print(f'SHA-256 verified {len(actual)} existing game resources for {app}.')
          encrypted_delta = fetch(os.environ['GITHUB_SHA'], 'apple-port/final-capture-audit/snake-responsive-18.aesgcm')
          update = cipher.decrypt(encrypted_delta[:12], encrypted_delta[12:], b'snake-responsive-build18-native')
          if hashlib.sha256(update).hexdigest() != os.environ['CANDIDATE_DELTA_SHA256']:
              raise ValueError('Encrypted candidate delta disagreed with its audited local SHA-256.')
          with ZipFile(BytesIO(update)) as overlay:
              candidate = json.loads(overlay.read('audit/payload-candidate.json'))
              wanted = candidate['final_files']
              replacements = {name for name in wanted if expect['files'].get(name) != wanted[name]}
              actual_replacements = {name for name in overlay.namelist() if name.startswith('Apps/MyPetSnake/game/')}
              if replacements != actual_replacements or replacements != set(candidate['changes']):
                  raise ValueError('Responsive delta did not match exact approved code changes.')
              if hashlib.sha256(overlay.read('project.json')).hexdigest() != candidate['candidate_project_sha256']:
                  raise ValueError('Candidate project bytes are mismatched.')
              checked_extract(overlay)
          actual = {file.relative_to(root).as_posix(): hashlib.sha256(file.read_bytes()).hexdigest()
                    for file in game.rglob('*') if file.is_file()}
          manifest = hashlib.sha256(json.dumps(actual,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          if actual != wanted or manifest != os.environ['CANDIDATE_GAME_MANIFEST_SHA256']:
              raise ValueError('The composed responsive game source differs from signed-candidate source.')
          if candidate['candidate_source_archive_sha256'] != os.environ['CANDIDATE_SOURCE_SHA256']:
              raise ValueError('Responsive source ZIP provenance changed.')
          settings = json.loads((root / 'project.json').read_bytes())['targets']['MyPetSnake-iOS']['settings']['base']
          if (settings['MARKETING_VERSION'], settings['CURRENT_PROJECT_VERSION']) != ('1.16','18'):
              raise ValueError('Expected exact candidate version 1.16 build 18.')
          print(f'SHA-256 verified exact build 18 game files and native project. Game manifest {manifest}.')
          sealed_probe = fetch(os.environ['GITHUB_SHA'], 'apple-port/final-capture-audit/snake-responsive-18-xctest-filesystem.aesgcm')
          probe = cipher.decrypt(sealed_probe[:12], sealed_probe[12:], b'snake-responsive-build18-filesystem')
          if hashlib.sha256(probe).hexdigest() != 'b71584418f362cef4baf14128967b57eb5ff4a171c558791d44dd9c91745d11b':
              raise ValueError('Test observer digest differs from the reviewed local archive.')
          with ZipFile(BytesIO(probe)) as observers:
              filenames = ('RuntimeScreenshots.swift', 'SnakeNativeUITests.swift', 'snake-native-probe.js',
                           'prepare.py', 'run.sh', 'verify.py', 'driver.py')
              allowed = {'audit/snake-native-xcuitest/' + name for name in filenames}
              if set(observers.namelist()) != allowed:
                  raise ValueError('Runner observer contains entries outside the test harness.')
              checked_extract(observers)
          print('Applied reviewed XCTest-only filesystem observer and bounded WebKit callbacks.')
          shim = root / 'audit/snake-native-xcuitest/RuntimeScreenshots.swift'
          source = shim.read_bytes()
          before = b'let ready = try windowStatus(isRelaunch ? "restored" : "dutch-presented", from: [:], in: view)'
          after = before.replace(b'let ready', b'let finalStatus', 1)
          boundary = source.index(before)
          if source.count(before) != 1:
              raise ValueError('Exact test-only compile recovery location changed.')
          tail = source[boundary:].replace(before, after, 1)
          prior_write = b'try Data(ready.utf8).write(to: statusFile, options: .atomic)'
          if tail.count(prior_write) != 1:
              raise ValueError('Exact final native status write location changed.')
          shim.write_bytes(source[:boundary] + tail.replace(prior_write, b'try Data(finalStatus.utf8).write(to: statusFile, options: .atomic)', 1))
          print('Corrected the test-only Swift final status variable name.')
          path = root / 'audit/snake-native-xcuitest/driver.py'
          driver = path.read_text(encoding='utf-8')
          
          def replace_once(before, after):
              global driver
              if driver.count(before) != 1:
                  raise ValueError('Pinned iPad host driver scope changed.')
              driver = driver.replace(before, after)
          
          replace_once('from threading import Thread', 'from threading import Event, Thread')
          replace_once('    events = Queue()\n', '    events = Queue()\n    passed_case = Event()\n')
          replace_once(
              '            match = re.fullmatch(r"\\s*SNAKE_XCTEST_STAGE ([a-z0-9-]+)\\s*", line)',
              '''            if re.fullmatch(
                          r"Test Case '-\\[SnakeNativeUITests\\.SnakeNativeUITests testGameplayCaptureAndRelaunch\\]' passed \\([0-9.]+ seconds\\)\\.",
                          line.strip()
                      ):
                          passed_case.set()
                          events.put("capture-case-passed")
                      match = re.fullmatch(r"\\s*SNAKE_XCTEST_STAGE ([a-z0-9-]+)\\s*", line)'''
          )
          replace_once(
              '    app_pid = None\n',
              '''    app_pid = None
              teardown_deadline = None
              stopped_after_pass = False
          '''
          )
          replace_once(
              '            threshold = 170 if observer is None else 72\n',
              '''            if passed_case.is_set() and isinstance(app_pid, int) and app_pid >= 2:
                          if teardown_deadline is None:
                              signal_game(app_pid, signal.SIGTERM)
                              teardown_deadline = time.monotonic() + 15
                              activity("passed-capture-case-teardown-started")
                          elif time.monotonic() >= teardown_deadline and process.poll() is None:
                              milestone("stopping-owned-xcodebuild-after-passed-case")
                              process.terminate()
                              try:
                                  process.wait(timeout=8)
                              except subprocess.TimeoutExpired:
                                  process.kill()
                                  process.wait(timeout=8)
                              stopped_after_pass = True
                              break
          
                      threshold = 170 if observer is None else 72
          '''
          )
          replace_once(
              '    if failure or process.returncode:\n        return 1\n',
              '''    if failure or not passed_case.is_set() or (process.returncode != 0 and not stopped_after_pass):
                  return 1
              write_packet(output / "post-case-teardown.json", {
                  "passed_test_case": "SnakeNativeUITests.testGameplayCaptureAndRelaunch",
                  "owned_xcodebuild_stopped_by_host": stopped_after_pass,
                  "xcodebuild_exit": process.returncode
              })
          '''
          )
          replace_once(
              '    try:\n        reader.join(timeout=3)\n    finally:\n        process.stdout.close()\n',
              '    reader.join(timeout=3)\n    if not reader.is_alive():\n        process.stdout.close()\n'
          )
          replace_once('            threshold = 170 if observer is None else 72\n',
                       '            threshold = 330 if observer is None else 72\n')
          compile(driver, str(path), 'exec')
          path.write_text(driver, encoding='utf-8')
          print('Enabled iPad fresh launch after the exact native capture XCTest case passed.')

          PY
      - name: Capture responsive Snake and verify persistence through a new native process
        run: |
          set -euo pipefail
          exec 3>&1
          exec >> "$RUNNER_TEMP/capture.log" 2>&1
          /bin/bash "$RUNNER_TEMP/capture-source/audit/snake-native-xcuitest/run.sh"
      - name: Encrypt App Store screenshots and diagnostic receipts
        if: always()
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        run: |
          set -euo pipefail
          if [[ ! -x "$RUNNER_TEMP/cryptoenv/bin/python" ]]; then exit 0; fi
          "$RUNNER_TEMP/cryptoenv/bin/python" - <<'PY'
          import os
          from pathlib import Path
          import shutil
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          root = Path(os.environ['RUNNER_TEMP'])
          cipher = AESGCM(bytes.fromhex(os.environ['IPA_KEY_HEX']))
          captures = root / 'captures'
          if captures.is_dir():
              shutil.make_archive(str(root/'screenshots-native'), 'zip', captures)
          for name in ('capture.log', 'screenshots-native.zip'):
              if (root / name).exists():
                  nonce = os.urandom(12)
                  (root / (name+'.aesgcm')).write_bytes(nonce + cipher.encrypt(nonce, (root / name).read_bytes(), None))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.slot }}-responsive-native-encrypted
          path: |
            ${{ runner.temp }}/capture.log.aesgcm
            ${{ runner.temp }}/screenshots-native.zip.aesgcm
          retention-days: 1
          if-no-files-found: ignore
