name: Apple WebKit Launch Services check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - {scheme: MyPetSnake-Mac, runner: macos-26}
          - {scheme: Timbersack-Mac, runner: macos-26}
          - {scheme: Timbersack-Mac, runner: macos-15}
    env:
      SCHEME: ${{ matrix.scheme }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare native build tools
        run: |
          set -euo pipefail
          xcodebuild -version
          brew install xcodegen
          python3 -m venv "$RUNNER_TEMP/cryptoenv"
          "$RUNNER_TEMP/cryptoenv/bin/pip" install --quiet cryptography==50.0.1
      - name: Decrypt verified game payload
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cryptoenv/bin/python" - <<'PY'
          import io, os
          from pathlib import Path
          from zipfile import ZipFile
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          data = Path('apple-port/candidate.aesgcm').read_bytes()
          key = bytes.fromhex(os.environ['IPA_KEY_HEX'])
          payload = AESGCM(key).decrypt(data[:12], data[12:], None)
          root = (Path(os.environ['RUNNER_TEMP']) / 'apple-source').resolve()
          root.mkdir()
          with ZipFile(io.BytesIO(payload)) as package:
              for name in package.namelist():
                  if not (root / name).resolve().is_relative_to(root):
                      raise ValueError('Game source entry is outside its directory')
              package.extractall(root)
          PY
      - name: Launch through macOS Launch Services and capture WebKit diagnostics
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/apple-source"
          key="${SCHEME%-*}"
          product="$root/build/$SCHEME/products/$key.app"
          output="$RUNNER_TEMP/apple-runtime.txt"
          errors="$RUNNER_TEMP/apple-runtime-errors.txt"
          exec > "$RUNNER_TEMP/compile.log" 2>&1
          sw_vers
          bash "$root/build-unsigned.sh" "$SCHEME"
          codesign --force --sign - --timestamp=none \
              --entitlements "$root/Apps/$key/Mac.entitlements" "$product"
          touch "$output" "$errors"
          if ! python3 - "$product" "$output" "$errors" <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          product, output, errors = sys.argv[1:]
          try:
              result = subprocess.run(['/usr/bin/open', '-W', '-n', '--stdout', output, '--stderr', errors, product],
                                      timeout=100, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              print(result.stdout)
          except subprocess.TimeoutExpired:
              print('Opening the smoke app timed out.')
          text = Path(output).read_text(errors='replace') + Path(errors).read_text(errors='replace')
          print(text)
          if 'APPLE_RUNTIME_SMOKE_PASS' not in text:
              raise SystemExit(1)
          PY
          then
            /usr/bin/log show --last 3m --style compact --info --predicate \
              'subsystem BEGINSWITH "com.apple.WebKit" OR process CONTAINS[c] "WebKit"' | tail -100 || true
            exit 1
          fi
      - name: Encrypt build and diagnostics
        if: always()
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        run: |
          set -euo pipefail
          if [[ ! -x "$RUNNER_TEMP/cryptoenv/bin/python" ]]; then exit 0; fi
          "$RUNNER_TEMP/cryptoenv/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          root = Path(os.environ['RUNNER_TEMP'])
          cipher = AESGCM(bytes.fromhex(os.environ['IPA_KEY_HEX']))
          for name in ['unsigned-app.zip', 'compile.log']:
              path = root / name
              if path.is_file():
                  nonce = os.urandom(12)
                  (root / f'{name}.aesgcm').write_bytes(nonce + cipher.encrypt(nonce, path.read_bytes(), None))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.scheme }}-${{ matrix.runner }}-encrypted
          path: ${{ runner.temp }}/*.aesgcm
          retention-days: 1
          if-no-files-found: ignore
