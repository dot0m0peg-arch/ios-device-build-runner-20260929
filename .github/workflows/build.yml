name: My Pet Snake build 20 compact phone layout with native QA
on: workflow_dispatch
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/codex/snake-phone-layout20-20261119'
    runs-on: xcode-27
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {app: MyPetSnake, platform: IOS}
    env:
      APP_KEY: ${{ matrix.app }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Select stable Xcode 27 and iPhoneOS SDK 27
        shell: bash
        run: |
          set -euo pipefail
          chosen=''
          for app in /Applications/Xcode_27.2.app; do
            developer="$app/Contents/Developer"
            [[ -x "$developer/usr/bin/xcodebuild" ]] || continue
            if ! info="$(DEVELOPER_DIR="$developer" xcodebuild -version)"; then continue; fi
            version="$(printf '%s\n' "$info" | awk '/^Xcode / {print $2}')"
            build="$(printf '%s\n' "$info" | awk '/^Build version / {print $3}')"
            if ! sdk="$(DEVELOPER_DIR="$developer" xcrun --sdk iphoneos --show-sdk-version)"; then continue; fi
            case "$version|$build|$sdk" in
              '27.2|27B52|27.2') ;;
              *) continue ;;
            esac
            chosen="$developer"
            break
          done
          if [[ -z "$chosen" ]]; then
            echo 'The runner has no allowlisted stable Xcode 27 / iPhoneOS 27 toolchain.' >&2
            exit 1
          fi
          {
            printf 'DEVELOPER_DIR=%s\n' "$chosen"
            printf 'SNAKE_RELEASE_XCODE_VERSION=%s\n' "$version"
            printf 'SNAKE_RELEASE_XCODE_BUILD=%s\n' "$build"
            printf 'SNAKE_RELEASE_IPHONE_SDK=%s\n' "$sdk"
          } >> "$GITHUB_ENV"
          printf 'Selected stable Xcode %s (%s) with iPhoneOS SDK %s.\n' "$version" "$build" "$sdk"

      - name: Prepare trusted build tools
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install xcodegen
          if ! command -v python3.12 >/dev/null; then brew install python@3.12; fi
          python3.12 -m venv "$RUNNER_TEMP/cryptoenv"
          "$RUNNER_TEMP/cryptoenv/bin/pip" install --quiet cryptography==50.0.1 Pillow==11.3.0
      - name: Decrypt exact release inputs
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cryptoenv/bin/python" - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from zipfile import ZipFile
          from urllib.request import Request,urlopen
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          import hashlib,json,os
          app=os.environ['APP_KEY']
          repo=os.environ['GITHUB_REPOSITORY']
          sha=os.environ['GITHUB_SHA']
          api='https://api.github.com/repos/'+repo+'/git/trees/'+sha+'?recursive=1'
          req=Request(api,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urlopen(req,timeout=60) as response:tree=json.load(response)
          assert not tree.get('truncated',False)
          files={v['path']:v['sha'] for v in tree['tree'] if v['type']=='blob'}
          cipher=AESGCM(bytes.fromhex(os.environ['IPA_KEY_HEX']))
          def download(name):
              with urlopen('https://raw.githubusercontent.com/'+repo+'/'+sha+'/'+name,timeout=180) as response:data=response.read()
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\x00'+data).hexdigest()
              assert expected==files[name],'Git object identity mismatch'
              return data
          segments=sorted(p for p in files if p.startswith('apple-port/'+app+'/') and p.endswith('.aesgcm'))
          assert segments,'No verified encrypted game segments'
          root=Path(os.environ['RUNNER_TEMP'])/'apple-source'
          root.mkdir()
          base=root.parent/'base.zip'
          with base.open('wb') as output:
              for index,name in enumerate(segments):
                  assert Path(name).stem==f'{index:03d}'
                  encrypted=download(name)
                  output.write(cipher.decrypt(encrypted[:12],encrypted[12:],f'{app}:{index}'.encode()))
          encrypted=download('apple-port/store-release/snake-phone20-overlay.aesgcm')
          patch=cipher.decrypt(encrypted[:12],encrypted[12:],b'snake-phone-layout20-20261119')
          for layer in [ZipFile(base),ZipFile(BytesIO(patch))]:
              with layer:
                  for name in layer.namelist():assert (root/name).resolve().is_relative_to(root.resolve())
                  layer.extractall(root)
          expected=json.loads((root/'release/expected-game-hashes.json').read_text())[app]
          game=root/'Apps'/app/'game'
          actual={p.relative_to(game).as_posix():hashlib.file_digest(p.open('rb'),'sha256').hexdigest() for p in game.rglob('*') if p.is_file()}
          assert expected and actual==expected,'Frozen game content did not match approved source'
          candidate=json.loads((root/'release/snake-phone20-candidate.json').read_bytes())
          native_manifest={'Apps/'+app+'/game/'+name: value for name,value in actual.items()}
          manifest=hashlib.sha256(json.dumps(native_manifest,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert len(actual)==candidate['game_file_count'] and manifest==candidate['game_manifest_sha256']
          settings=json.loads((root/'project.json').read_bytes())['targets']['MyPetSnake-iOS']['settings']['base']
          assert (settings['PRODUCT_BUNDLE_IDENTIFIER'],settings['MARKETING_VERSION'],settings['CURRENT_PROJECT_VERSION']) == ('com.mypetsnake.game','1.16','20')
          for name,expected_hash in candidate['unchanged_native_and_ios_icon_files'].items():
              with (root/name).open('rb') as f:
                  assert hashlib.file_digest(f,'sha256').hexdigest()==expected_hash
          print(app+': build 20, reviewed gameplay, native Swift and iOS icons verified.')
          PY
      - name: Verify native compact phone and iPad gameplay before signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-output"
          "$RUNNER_TEMP/cryptoenv/bin/python" - <<'PY' >"$RUNNER_TEMP/release-output/native-gate.log" 2>&1
          from pathlib import Path
          import os,json,shutil,subprocess
          root=Path(os.environ['RUNNER_TEMP'])
          src=root/'apple-source'
          qa=root/'capture-source'
          shutil.copytree(src,qa)
          candidate=json.loads((src/'release/snake-phone20-candidate.json').read_bytes())
          env=dict(os.environ,CANDIDATE_GAME_MANIFEST_SHA256=candidate['game_manifest_sha256'],SNAKE_QA_PYTHON=str(root/'cryptoenv/bin/python'))
          subprocess.run(['bash',str(qa/'release/native-qa/run.sh'),str(qa),str(root/'native-qa-output')],env=env,check=True,timeout=1900)
          subprocess.run([str(root/'cryptoenv/bin/python'),str(src/'release/verify-native-acceptance.py'),str(root/'native-qa-output'),str(src/'release/snake-phone20-candidate.json')],check=True,timeout=60)
          PY
          echo 'Exact candidate passed native phone and iPad layout/gameplay gates.'
      - name: Sign validate and upload release candidate
        env:
          APPLE_DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          APPLE_INSTALLER_P12: ${{ secrets.APPLE_INSTALLER_P12 }}
          APPLE_SIGNING_P12_PASSWORD: ${{ secrets.APPLE_SIGNING_P12_PASSWORD }}
          APPLE_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPLE_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_STORE_CONNECT_KEY_ID }}
          APPLE_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_STORE_CONNECT_ISSUER_ID }}
        run: python3 "$RUNNER_TEMP/apple-source/release/build_release.py"
      - name: Encrypt packages and diagnostics
        if: always()
        env:
          IPA_KEY_HEX: ${{ secrets.IPA_KEY_HEX }}
        run: |
          set -euo pipefail
          if [[ ! -x "$RUNNER_TEMP/cryptoenv/bin/python" ]]; then exit 0; fi
          "$RUNNER_TEMP/cryptoenv/bin/python" - <<'PY'
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          import os
          root=Path(os.environ['RUNNER_TEMP'])
          dest=root/'encrypted-release'
          dest.mkdir(exist_ok=True)
          cipher=AESGCM(bytes.fromhex(os.environ['IPA_KEY_HEX']))
          import shutil
          if (root/'native-qa-output').is_dir():
              (root/'release-output').mkdir(exist_ok=True)
              shutil.make_archive(str(root/'release-output/native-qa'), 'zip', root/'native-qa-output')
          for p in (root/'release-output').glob('*'):
              if p.is_file():
                  nonce=os.urandom(12)
                  (dest/(p.name+'.aesgcm')).write_bytes(nonce+cipher.encrypt(nonce,p.read_bytes(),None))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.app }}-build20-phone-layout-encrypted
          path: ${{ runner.temp }}/encrypted-release/*.aesgcm
          retention-days: 3
          if-no-files-found: ignore
